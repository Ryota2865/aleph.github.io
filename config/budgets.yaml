# 予算宣言（PLAN §2.1・§11・§14.1）— 3系統を別々に計上する
api:
  usd_per_month: 45.0        # 2026-08-01に期限actionとして71→45へ変更。
                             # 8–9月文学的帰還campaignの従量API hard capであり、
                             # Author benchmark上限$30を含む。支出目標ではない。
                             # 2026-07のcap $71と実績は遡及変更しない。
  usd_per_work: 9.0          # 3.0→4.5→6.0→8.0→9.0。w0005で公開ゲートの保守的precheckが
                             # FINISH時に作品上限へ達したため9.0へ調整。月次hard cap $45が最終防壁
harness:
  calls_per_day: 40          # 控えめ運用（PLAN §15-1 の作業前提）
  concurrent: 1
local:
  gpu_hours_per_day: 8
  swap_cost_seconds: 90      # モデル交換コスト。実測81秒（2026-07-09、26B→27B Q4、RTX 3090実機）に余裕を持たせ校正

publish:                     # 公開の規律（PLAN §7.3d・§14.3-7）
  max_per_month: 4           # 2026-07限定の999を2026-08-01期限actionで4へ復帰。
                             # hard capであり公開目標ではない。8–9月の公開実績目安は月0–1。
  cadence: weekly
  full_novel_per_month: 1    # 完成長編の一括公開の目安

opportunistic_reentry:       # 機会的エッジの限定予算（PLAN §2.4）
  max_per_work: 2
  scout_calls_each: 30
